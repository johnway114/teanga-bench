[project]
name = "teanga-bench"
version = "0.2.0"
description = "Teanga Bench: an Inspect AI benchmark for Irish, Welsh, and learner English."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "John Conway"}]
dependencies = [
  "certifi",
  "inspect-ai>=0.3.290",
  "numpy>=1.26",
  "openai>=1.0",
  "pyyaml>=6",
  "sacrebleu>=2.4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
teanga-bench = "teanga_bench.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["teanga_bench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
